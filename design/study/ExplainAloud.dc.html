<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explain it aloud</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7490}a:hover{color:#0B5568}
@keyframes ring{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.35);opacity:0}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid #0E7490;animation:ring 2.4s ease-out infinite}
.ring2{animation-delay:.8s}.ring3{animation-delay:1.6s}
.eq{transform-origin:center;animation:eq .9s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF9; font-family: Inter, system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 0 8px">
    <a href="Practice.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="font-size: 13px; font-weight: 700">Explain it aloud</span>
    <span style="width: 44px"></span>
  </div>

  <div style="padding: 14px 24px 0; display: flex; flex-direction: column; gap: 8px; text-align: center; align-items: center">
    <span style="font-size: 12px; font-weight: 600; color: #0E7490; font-family: 'JetBrains Mono', monospace">BIO 201 · Inhibition</span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.3; letter-spacing: -0.015em">Explain competitive inhibition as if to a friend.</h1>
    <span style="font-size: 14px; color: #6B6B73">Aim for about a minute.</span>
  </div>

  <div style="position: relative; width: 190px; height: 190px; margin: 28px auto 0">
    <span class="ring"></span><span class="ring ring2"></span><span class="ring ring3"></span>
    <svg width="190" height="190" viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; inset: 0">
      <defs><radialGradient id="ze1" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#A8E6F1"></stop><stop offset="0.5" stop-color="#1F9AB5"></stop><stop offset="1" stop-color="#0B5568"></stop></radialGradient></defs>
      <circle cx="50" cy="50" r="30" fill="url(#ze1)"></circle>
      <ellipse cx="39" cy="35" rx="8" ry="4.5" fill="#FFFFFF" opacity="0.45" transform="rotate(-28 39 35)"></ellipse>
      <ellipse cx="42" cy="49" rx="3.6" ry="5" fill="#151827"></ellipse><ellipse cx="58" cy="49" rx="3.6" ry="5" fill="#151827"></ellipse>
      <circle cx="43.4" cy="47" r="1.3" fill="#FFFFFF"></circle><circle cx="59.4" cy="47" r="1.3" fill="#FFFFFF"></circle>
      <path d="M45 60q5 3 10 0" stroke="#151827" stroke-width="2.4" fill="none" stroke-linecap="round"></path>
    </svg>
  </div>

  <div style="display: flex; justify-content: center; align-items: center; gap: 4px; height: 40px; margin-top: 18px" aria-hidden="true">
    <sc-for list="{{ eq }}" as="e" hint-placeholder-count="24">
      <span class="eq" style="width: 4px; height: {{ e.h }}px; border-radius: 2px; background: #0E7490; animation-delay: {{ e.d }}s"></span>
    </sc-for>
  </div>
  <span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; margin-top: 6px">0:38</span>

  <div style="margin: 20px 16px 0; background: #FFFFFF; border: 1px solid #E5E5E3; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 13px; font-weight: 700; color: #52525B">Key ideas, as you go</span>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 26px; height: 26px; border-radius: 13px; background: #0E7490; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      <span style="flex: 1; font-size: 15px">Binds the active site</span><span style="font-size: 12px; font-weight: 700; color: #0B5568">Covered</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #0E7490; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 5px 0 0 5px; background: #0E7490; margin-right: 10px"></span></span>
      <span style="flex: 1; font-size: 15px">More substrate wins it back</span><span style="font-size: 12px; font-weight: 700; color: #0B5568">Partly</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 26px; height: 26px; border-radius: 13px; border: 2px dashed #A1A1AA; box-sizing: border-box; flex-shrink: 0"></span>
      <span style="flex: 1; font-size: 15px; color: #52525B">Vmax stays the same</span><span style="font-size: 12px; font-weight: 600; color: #6B6B73">Not yet</span>
    </div>
  </div>

  <div style="flex: 1"></div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 24px; padding-bottom: 14px">
    <button style="height: 44px; padding: 0 14px; border: none; background: transparent; color: #52525B; font-size: 14px; font-weight: 600; font-family: Inter, sans-serif">Start over</button>
    <button aria-label="Done talking" style="width: 76px; height: 76px; border-radius: 38px; border: none; background: #18181B; display: flex; align-items: center; justify-content: center">
      <span style="width: 22px; height: 22px; border-radius: 5px; background: #FFFFFF"></span></button>
    <button style="height: 44px; padding: 0 14px; border: none; background: transparent; color: #52525B; font-size: 14px; font-weight: 600; font-family: Inter, sans-serif">Give a hint</button>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 6px; padding-bottom: 22px; font-size: 12px; color: #6B6B73">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Your voice stays on this phone</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const hs = [10,18,26,34,22,30,38,28,16,24,36,40,30,20,34,26,18,28,22,14,24,16,10,8];
    return { eq: hs.map((h, i) => ({ h: h, d: ((i * 0.13) % 0.9).toFixed(2) })) };
  }
}
</script>
</body>
</html>
