name: Release APK

# Pushing a v* tag builds the app and publishes the APKs as a GitHub release.
#
# This exists because a release artifact should come from a reproducible build of a known commit,
# not from whatever was on someone's laptop. It also solves the practical problem that the APK is
# far too large to hand over any other way.
on:
  push:
    tags:
      - 'v*'
  # Also runnable by hand from the Actions tab with no setup: it tags whatever commit it ran
  # against. That matters because a tag cannot always be pushed from every environment, and a
  # release should never be blocked on which machine happened to be holding the credentials.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and release (e.g. v18)'
        required: false
        default: 'v18' 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        # A release that fails its own tests is not a release. Runs before the build so a broken
        # commit cannot produce a downloadable artifact.
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        # arm64-v8a only — see the splits block in app/build.gradle.kts for why.
        run: ./gradlew assembleDebug

      - name: Check no credential was baked into the APK
        # The app reads its Gemini key from on-device storage precisely so that nothing secret ends
        # up in a published artifact. This asserts that rather than assuming it: this repository
        # and its releases are public, and an API key inside a public APK is a published key.
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/*.apk; do
            if strings "$apk" | grep -qE 'AIzaSy[0-9A-Za-z_-]{33}|AQ\.[0-9A-Za-z_-]{20,}'; then
              echo "::error::$apk contains something shaped like an API key"
              exit 1
            fi
          done
          echo "No credential-shaped strings found."

      - name: Name the artifact
        id: rename
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          for apk in app/build/outputs/apk/debug/*.apk; do
            base="$(basename "$apk" .apk)"
            abi="${base#app-}"; abi="${abi%-debug}"
            cp "$apk" "dist/MeetingMind-${version}-${abi}.apk"
          done
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit when it does not already exist.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: MeetingMind ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # Debug-signed, so it installs alongside nothing and needs "install from unknown sources".
          prerelease: true
          generate_release_notes: true
          body_path: docs/RELEASE_NOTES.md
          files: dist/*.apk
